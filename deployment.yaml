apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      version: blue
  template:
    metadata:
      labels:
        app: food-portal
        version: blue
    spec:
      containers:
      - name: food-portal
        image: nandana200621/food-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      version: green
  template:
    metadata:
      labels:
        app: food-portal
        version: green
    spec:
      containers:
      - name: food-portal
        image: nandana200621/food-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: food-portal-service
spec:
  type: NodePort
  selector:
    app: food-portal
    version: blue
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
